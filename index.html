<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>GitHub Profile Finder</h1>
    <div class="search-box">
        <input type="text" id="username" placeholder="Enter GitHub username">
    <button id="searchBtn">Search</button>
    </div>

    <div id="profile">
        <img src="" alt="Profile Picture" id="avatar">
        <h2 id="name"></h2>
        <p id="login"></p>
        <p id="bio"></p>
        <p id="followers"></p>
        <p id="following"></p>
        <p id="repos"></p>
        <a id="reposLink" href="" target="_blank">View Repositories</a>

        <a id="profileLink" href="" target="_blank">View GitHub Profile</a>
    </div>
    <p id="message">Search for a GitHub user to see their profile.</p>
    <script src="script.js"></script>
</body>
</html>
